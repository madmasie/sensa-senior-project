; PlatformIO Project Configuration File

[platformio]
; Only build the ESP32 firmware by default. The native env is test-only —
; run it with: ~/.platformio/penv/bin/pio test -e native
default_envs = rymcu-esp32-s3-devkitc-1

[env]
test_framework = googletest
lib_deps =
  sensirion/Sensirion I2C SEN5X @ ^0.3.0

[env:rymcu-esp32-s3-devkitc-1]
platform = espressif32
board = rymcu-esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Iinclude

[env:native]
platform = platformio/native
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Iinclude
test_filter = native/*
; src/ is excluded from the native env — it depends on Arduino.h which only
; exists on the ESP32 toolchain. build_src_filter = -<*> excludes everything.
build_src_filter = -<*>
