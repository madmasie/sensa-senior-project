; PlatformIO Project Configuration File

[platformio]
; Only build the ESP32 firmware by default. The native env is test-only —
; run it with: ~/.platformio/penv/bin/pio test -e native
; To build for the custom PCB instead: pio run -e sensa-pcb
default_envs = rymcu-esp32-s3-devkitc-1
 
[env]
test_framework = googletest
lib_deps =
  sensirion/Sensirion I2C SEN5X @ ^0.3.0

; ── Dev board (RYMCU ESP32-S3-DevKitC-1) ────────────────────────────────────
; This is the original developer board used for early firmware work.
; It has a built-in RGB LED on GPIO38 but no motor or buzzer.
[env:rymcu-esp32-s3-devkitc-1]
platform = espressif32
board = rymcu-esp32-s3-devkitc-1
board_build.flash_mode = dio
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Iinclude -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D BOARD_HAS_PSRAM=0

; ── Custom Sensa PCB (ESP32-S3-WROOM-1) ─────────────────────────────────────
; Custom PCB peripherals:
;   GPIO10 — vibration motor (MOSFET low-side switch)
;   GPIO11 — piezo buzzer
;   GPIO16 — STATUS_LED (GPIO-driven indicator LED)
;   LED_CHG — charge indicator driven by MCP73831 IC, no firmware needed
; SENSA_PCB flag enables PCB-specific pin assignments and alert outputs.
; Uses esp32-s3-devkitc-1 as the closest matching board definition —
; the WROOM-1 module is pin-compatible for our purposes.
[env:sensa-pcb]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Iinclude -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D BOARD_HAS_PSRAM=0 -D SENSA_PCB

[env:native]
platform = platformio/native
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Iinclude
test_filter = native/*
; src/ is excluded from the native env — it depends on Arduino.h which only
; exists on the ESP32 toolchain. build_src_filter = -<*> excludes everything.
build_src_filter = -<*>

