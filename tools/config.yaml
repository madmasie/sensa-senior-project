# config.yaml — Single configuration file for all Sensa tools.
#
# This one file is read by every script in tools/:
#   data_uploader.py / data_sync.py  → data_sync section
#   pytorch_calibration/main.py            → data, model, training, export
#   pytorch_calibration/train_public.py    → public_data
#   pytorch_calibration/fetch_public_data.py → public_data
#
# Each script locates this file relative to its own path, so the scripts work
# no matter which directory you launch them from.

# ═════════════════════════════════════════════════════════════════════════════
# DATA SYNC (rclone upload / download of raw SEN55 recordings)
# Used by: data_uploader.py, data_sync.py
# ═════════════════════════════════════════════════════════════════════════════
data_sync:
  # Where uart_logger.py saves sen55_*.pkl files on THIS machine.
  # Keep this OUTSIDE the git repo so data files stay out of version control.
  # ~ expands to your home directory, so this default works on any machine.
  #   Windows example: C:/Users/yourname/sensa-recordings
  recording_dir: ~/sensa-recordings

  # The rclone remote and folder path where data is shared with the team.
  # Format: <remote-name>:<folder-path>
  #
  # Setup steps (one time per machine):
  #   1. Install rclone: https://rclone.org/install/
  #   2. Run: rclone config
  #      - New remote → name it "sensa" (must match the name below)
  #      - Choose your storage type (Google Drive is free and easy)
  #   3. Verify it works: rclone ls sensa:sensa-data/
  #
  # All team members must name their remote "sensa" (or change it here
  # consistently) and point it at the same shared folder.
  rclone_remote: sensa:sensa-data/raw

  # Where data_sync.py copies downloaded .pkl files so that prepare_data.py
  # and the pytorch_calibration pipeline can find them.
  # This path is relative to the tools/ directory.
  training_data_dir: pytorch_calibration/data/raw

# ═════════════════════════════════════════════════════════════════════════════
# CALIBRATION MODEL — LOCAL PIPELINE (SEN55 + BAM co-location)
# Used by: pytorch_calibration/main.py
#
# All tunable parameters live here so you never have to edit Python files
# to change a learning rate, file path, or model size.
# ═════════════════════════════════════════════════════════════════════════════
data:
  # Directory containing raw SEN55 .pkl files (output of uart_logger.py)
  # and the BAM or AQS reference CSV.
  raw_dir: data/raw

  # Where the paired (SEN55 + reference) CSV will be written by prepare_data.py.
  paired_dir: data/paired

  # Name of the paired dataset file inside paired_dir.
  paired_file: paired_dataset.csv

  # Name of the BAM or AQS reference CSV in raw_dir.
  # Expected columns: timestamp, bam_pm2_5
  # (See prepare_data.py for exact format requirements.)
  reference_file: bam_reference.csv

  # Fraction of data held out for validation (model selection, not final eval).
  val_frac: 0.15

  # Fraction of data held out for final testing (never seen during training).
  test_frac: 0.15

  # Random seed — fixing this makes every train/val/test split identical across
  # runs, so you can fairly compare different model configurations.
  seed: 42

# ─────────────────────────────────────────────────────────────────────────────
# MODEL
# ─────────────────────────────────────────────────────────────────────────────
model:
  # Number of input features fed to the network.
  # Default: all 8 SEN55 channels (pm1, pm2_5, pm4, pm10, temp, rh, voc, nox).
  # Reduce this if you want to train on fewer channels (e.g., PM-only).
  n_features: 8

  # Base channel width of the convolutional layers.
  # Doubling this roughly doubles the parameter count.
  # Keep ≤ 32 to stay under the ESP32-S3's 30 KB weight budget.
  n_channels: 16

# ─────────────────────────────────────────────────────────────────────────────
# TRAINING
# ─────────────────────────────────────────────────────────────────────────────
training:
  # How many samples the network sees per weight update.
  # Larger batches = more stable gradients; smaller batches = noisier but
  # sometimes generalise better. 32 is a safe default.
  batch_size: 32

  # Maximum number of full passes through the training data.
  # Early stopping (below) will usually terminate before this limit.
  epochs: 200

  # Step size for the Adam optimizer.
  # Think of this as the proportional gain on a control loop — too high and
  # the weights oscillate; too low and convergence is slow.
  learning_rate: 0.001

  # L2 weight decay — penalises large weights to prevent overfitting.
  # Useful when the dataset is small (< a few thousand samples).
  weight_decay: 1.0e-4

  # If validation loss does not improve for this many epochs, stop early.
  # Prevents wasting time and overfitting after the model has converged.
  early_stopping_patience: 20

# ─────────────────────────────────────────────────────────────────────────────
# EXPORT
# ─────────────────────────────────────────────────────────────────────────────
export:
  # Directory where trained models and conversion artefacts are saved.
  model_dir: models

  # Filename for the best PyTorch checkpoint (saved during training).
  pytorch_checkpoint: best_model.pt

  # Filename for the ONNX intermediate model.
  onnx_file: calibration.onnx

  # Filename for the final TFLite model deployed to the ESP32.
  tflite_file: calibration.tflite

  # Apply int8 post-training quantisation when converting to TFLite.
  # Recommended: true — reduces model size ~4× and speeds up ESP32 inference ~5-10×.
  # Requires a small sample of real input data (representative_data) to calibrate
  # the quantisation ranges. This is drawn automatically from the training set.
  quantize: true

  # Path where the generated C header (normalization constants) will be written.
  # Copy this file into the firmware's include/ directory.
  c_header_path: ../../include/calib_scaler.h

# ═════════════════════════════════════════════════════════════════════════════
# PUBLIC DATA PIPELINE (EPA AQS)
# Used by: pytorch_calibration/fetch_public_data.py, train_public.py
# Run: python fetch_public_data.py   → downloads and pairs AQS data
#      python train_public.py        → trains the public model
# ═════════════════════════════════════════════════════════════════════════════
public_data:
  # US state to download AQS data for.
  # Supported: CA TX NY FL CO WA OR AZ NV UT
  state: CA

  # Calendar years to download. More years = more data but longer download.
  # 2021-2022 gives a good balance of data volume and recency.
  years: [2021, 2022]

  # Set to true to also download SO2 (param 42401) and NO2 (param 42602).
  # Required to enable SO2Correction / NO2Correction below.
  # Adds ~200-400 MB to the download.
  include_gas: false

  # Path to the paired public dataset (output of fetch_public_data.py).
  paired_file: data/public/paired_public.csv

  # Input features for the public model.
  # These correspond to columns in paired_public.csv.
  # pm2_5_optical is the co-located continuous monitor reading (SEN55 analog).
  features: [pm2_5_optical, temp, rh]

  # Target variable: FRM/FEM reference PM2.5 from a BAM or filter sampler.
  target: pm2_5_reference

  # Physics-based pre-corrections applied to pm2_5_optical before training.
  # The ML model then learns residual calibration on top of these.
  # Set a coefficient to 0.0 to disable a correction without removing it.
  # Uncomment so2 / no2 only when include_gas: true.
  corrections:
    humidity:
      kappa: 0.5        # hygroscopic growth coefficient (0.3–0.8 typical)
    temperature:
      alpha: 0.0        # temperature sensitivity 1/°C (0 = disabled, not yet characterised)
      t_ref: 20.0       # reference temperature in °C
    # so2:
    #   beta: 0.0       # SO2 interference (µg/m³)/ppb — needs include_gas: true
    # no2:
    #   gamma: 0.0      # NO2 interference (µg/m³)/ppb — needs include_gas: true

  # Model config for the public pipeline (3 features instead of 8).
  # n_channels can be raised to 32 without ESP32 budget concerns for this model.
  model:
    n_features: 3
    n_channels: 16

  # Export paths — kept separate from the local pipeline so models/ is not
  # overwritten. Copy these to firmware only after validating the public model.
  export:
    model_dir: models_public
    pytorch_checkpoint: best_model_public.pt
    onnx_file: calibration_public.onnx
    tflite_file: calibration_public.tflite
    quantize: true
    c_header_path: ../../include/calib_scaler_public.h
